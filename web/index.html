  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background-color: #1E1E2E;
      overflow: hidden;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      background: #1E1E2E;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .ls-title {
      font-family: 'Courier New', Courier, monospace;
      font-size: clamp(12px, 2.5vw, 18px);
      color: #89B4FA;
      letter-spacing: 8px;
      text-transform: uppercase;
    }

    .ls-cursor {
      display: inline-block;
      width: 10px;
      height: 1em;
      background: #89B4FA;
      vertical-align: middle;
      margin-left: 4px;
      animation: blink 1s step-end infinite;
    }

    .ls-sub {
      font-family: 'Courier New', Courier, monospace;
      font-size: clamp(7px, 1vw, 10px);
      color: #6C7086;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .ls-bar-track {
      width: 160px;
      height: 4px;
      background: #313244;
    }

    .ls-bar-fill {
      height: 100%;
      width: 0;
      background: #89B4FA;
      animation: fill 2s ease-out forwards;
    }

    @keyframes fill {
      0%   { width: 0%; }
      30%  { width: 45%; }
      70%  { width: 75%; }
      100% { width: 100%; }
    }

    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="ls-title">MATHEUS DIAS<span class="ls-cursor"></span></div>
    <div class="ls-sub">Mobile Software Engineer</div>
    <div class="ls-bar-track">
      <div class="ls-bar-fill"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading-screen');
      if (el) {
        el.classList.add('fade-out');
        setTimeout(function () { el.remove(); }, 550);
      }
    });
  </script>
</body>
